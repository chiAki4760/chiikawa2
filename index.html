<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>13日の金曜日 // 湖畔キャンプ場の帳簿</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    :root {
      --moon: #dfeadf;

      --paper: #d9cdab;
      --paper-hi: #e8dfc3;
      --paper-lo: #c2b287;

      --ink: #241a12;
      --ink-soft: #5b4b38;
      --pen: #1d2b4f;

      --red: #8a1c1c;
      --red-hi: #b02a2a;

      --wood: #3d2a1a;
      --wood-hi: #5a3f27;
      --sign: #eadfbd;

      --serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
      --hand: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    }

    html { min-height: 100%; background: #050a08; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 44px 16px 40px;
      color: var(--ink);
      font-family: var(--serif);
      background: #050a08;
      overflow-x: hidden;
    }

    button, input, textarea { font: inherit; }

    /* =========================
       夜の湖畔（背景）
    ========================== */

    .scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .glint { animation: shimmer 7s ease-in-out infinite alternate; }

    @keyframes shimmer {
      from { opacity: .55; }
      to   { opacity: 1; }
    }

    .mist {
      position: fixed;
      left: -60%;
      width: 220%;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(ellipse 22% 50% at 20% 50%, rgba(190,215,205,.16), transparent),
        radial-gradient(ellipse 26% 50% at 55% 50%, rgba(190,215,205,.12), transparent),
        radial-gradient(ellipse 20% 50% at 85% 50%, rgba(190,215,205,.14), transparent);
      animation: drift 80s ease-in-out infinite alternate;
    }

    .mist.m1 { bottom: 26vh; height: 26vh; }
    .mist.m2 { bottom: 8vh;  height: 22vh; opacity: .8; animation-duration: 110s; animation-direction: alternate-reverse; }

    @keyframes drift {
      from { transform: translateX(-6%); }
      to   { transform: translateX(6%); }
    }

    #blackout {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
    }

    #blackout.flicker { animation: flicker 1.1s ease-out; }

    @keyframes flicker {
      0%   { opacity: 0; }
      12%  { opacity: .5; }
      26%  { opacity: .08; }
      42%  { opacity: .42; }
      100% { opacity: 0; }
    }

    /* =========================
       ページ枠
    ========================== */

    .page {
      position: relative;
      z-index: 2;
      max-width: 760px;
      margin: 0 auto;
    }

    /* =========================
       木製の看板
    ========================== */

    .sign {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px 15px;
      margin-bottom: 22px;
      background:
        repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 2px, transparent 2px 11px),
        linear-gradient(180deg, var(--wood-hi), var(--wood));
      border: 3px solid #1f1409;
      border-radius: 3px;
      box-shadow:
        0 12px 26px rgba(0,0,0,.65),
        inset 0 0 0 2px rgba(255,255,255,.05);
    }

    .sign::before,
    .sign::after {
      content: "";
      position: absolute;
      top: -34px;
      width: 3px;
      height: 34px;
      background: #8a7350;
    }

    .sign::before { left: 16%; }
    .sign::after  { right: 16%; }

    .sign h1 {
      margin: 0;
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: .14em;
      color: var(--sign);
      text-shadow: 0 -1px 0 rgba(0,0,0,.75), 0 1px 0 rgba(255,255,255,.14);
    }

    .sign-sub {
      margin: 4px 0 0;
      font-size: .78rem;
      letter-spacing: .12em;
      color: #c9bd98;
    }

    .tag {
      flex-shrink: 0;
      padding: 4px 11px;
      background: #c9c1a6;
      color: var(--ink);
      border: 2px solid #241608;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .1em;
      transform: rotate(2deg);
      box-shadow: 0 2px 0 rgba(0,0,0,.5);
    }

    .tag.review {
      background: var(--red);
      color: #f3e6d0;
    }

    /* =========================
       夜の進み
    ========================== */

    .dawn {
      margin: 0 0 18px;
      padding: 10px 14px 12px;
      background: rgba(4,9,8,.78);
      border: 1px solid rgba(223,234,223,.2);
      border-radius: 3px;
      color: #cfe0d3;
    }

    .dawn-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: .8rem;
      letter-spacing: .1em;
    }

    .dawn-track {
      height: 6px;
      background: rgba(255,255,255,.12);
      overflow: hidden;
    }

    .dawn-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #2b3b5c, #7d6f8f 55%, #e2a65c);
      transition: width .8s ease;
    }

    /* =========================
       帳簿の1ページ
    ========================== */

    .ledger {
      position: relative;
      padding: 34px 26px 26px 34px;
      background:
        radial-gradient(ellipse at 15% 8%, rgba(255,255,240,.55), transparent 55%),
        radial-gradient(ellipse at 92% 92%, rgba(110,80,35,.28), transparent 60%),
        linear-gradient(180deg, var(--paper-hi), var(--paper));
      border: 1px solid #9c8a5b;
      border-radius: 3px;
      box-shadow:
        0 18px 44px rgba(0,0,0,.7),
        inset 14px 0 18px -12px rgba(60,40,15,.45),
        inset 0 0 70px rgba(110,80,35,.22);
    }

    .ledger::after {
      content: "";
      position: absolute;
      top: 16px;
      right: 22px;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 3px solid rgba(90,60,30,.13);
      box-shadow: inset 0 0 0 6px rgba(90,60,30,.05);
      pointer-events: none;
    }

    .tape {
      position: absolute;
      top: -11px;
      left: 50%;
      width: 96px;
      height: 24px;
      transform: translateX(-50%) rotate(-2deg);
      background: rgba(232,222,172,.8);
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }

    .q-label {
      display: inline-block;
      margin: 0 0 14px;
      padding-bottom: 3px;
      border-bottom: 2px solid var(--red);
      color: var(--red);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .16em;
    }

    .story {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 1.02rem;
      font-weight: 500;
      line-height: 2;
    }

    /* 付箋 */

    .note {
      position: relative;
      max-width: 440px;
      margin: 20px 0 22px;
      padding: 11px 16px 13px;
      background: #e7d888;
      color: #3b3116;
      font-family: var(--hand);
      font-size: .88rem;
      line-height: 1.75;
      transform: rotate(-.8deg);
      box-shadow: 2px 5px 10px rgba(0,0,0,.28);
    }

    /* =========================
       借方・貸方（T字の帳簿）
    ========================== */

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin: 0 0 22px;
      border-top: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
    }

    .side { padding: 10px 14px 14px; }

    .side.credit { border-left: 2px solid var(--red); }

    .side-title {
      margin: 0 0 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(36,26,18,.5);
      text-align: center;
      font-size: .95rem;
      font-weight: 800;
      letter-spacing: .4em;
      text-indent: .4em;
    }

    .entry-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      margin-bottom: 6px;
    }

    .entry-row input {
      min-width: 0;
      padding: 8px 4px 5px;
      background: transparent;
      border: 0;
      border-bottom: 1.5px solid rgba(36,26,18,.45);
      border-radius: 0;
      color: var(--pen);
      font-family: var(--hand);
      font-size: 1rem;
      transition: background .15s, border-color .15s;
    }

    .entry-row input[type="text"]   { flex: 1.25; width: 0; }

    .entry-row input[type="number"] {
      flex: 1;
      width: 0;
      text-align: right;
      -moz-appearance: textfield;
    }

    .entry-row input::-webkit-outer-spin-button,
    .entry-row input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .entry-row input::placeholder { color: rgba(36,26,18,.38); }

    .entry-row input:focus {
      background: rgba(255,255,235,.5);
      border-bottom-color: var(--red);
    }

    .entry-row input:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 1px;
    }

    .btn-remove {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      background: none;
      border: 0;
      border-radius: 50%;
      color: var(--red);
      font-size: 1.05rem;
      cursor: pointer;
    }

    .btn-remove:hover { background: rgba(138,28,28,.12); }

    .btn-add {
      margin-top: 4px;
      padding: 6px 2px;
      background: none;
      border: 0;
      color: var(--ink-soft);
      font-size: .8rem;
      letter-spacing: .06em;
      cursor: pointer;
      text-decoration: underline dashed;
      text-underline-offset: 4px;
    }

    .btn-add:hover { color: var(--red); }

    /* =========================
       記帳ボタン（朱の押印風）
    ========================== */

    .btn-stamp {
      display: block;
      width: 100%;
      padding: 13px 10px;
      background: transparent;
      border: 3px solid var(--red);
      border-radius: 3px;
      outline: 1px solid rgba(138,28,28,.55);
      outline-offset: 3px;
      color: var(--red);
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: .35em;
      text-indent: .35em;
      cursor: pointer;
      transform: rotate(-.5deg);
      transition: background .15s, color .15s, transform .1s;
    }

    .btn-stamp:hover {
      background: var(--red);
      color: var(--paper-hi);
    }

    .btn-stamp:active { transform: rotate(-.5deg) translateY(2px); }

    .btn-stamp:focus-visible {
      outline: 3px solid var(--pen);
      outline-offset: 3px;
    }

    /* =========================
       結果
    ========================== */

    .result {
      display: none;
      position: relative;
      margin-top: 24px;
      padding: 16px 18px 16px 20px;
      background: rgba(255,255,238,.4);
      border-left: 4px solid var(--red);
      font-size: .93rem;
      line-height: 1.9;
      animation: appear .3s ease;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    .result strong {
      font-size: 1.02rem;
      letter-spacing: .06em;
    }

    .result .label {
      display: block;
      margin-top: 10px;
      color: var(--red);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .14em;
    }

    .result.wrong {
      background: rgba(60,40,20,.12);
      border-left-color: #2a2a2a;
    }

    .result.wrong strong,
    .result.wrong .label { color: #3d1313; }

    .answer-line {
      color: var(--pen);
      font-family: var(--hand);
      font-size: .95rem;
    }

    .stamp {
      position: absolute;
      top: -16px;
      right: 12px;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--red);
      border-radius: 50%;
      color: var(--red);
      font-size: 1.55rem;
      font-weight: 800;
      opacity: .9;
      transform: rotate(-14deg);
      animation: thud .35s cubic-bezier(.2, 1.6, .4, 1) both;
    }

    @keyframes thud {
      from { transform: rotate(-14deg) scale(2.3); opacity: 0; }
      to   { transform: rotate(-14deg) scale(1);   opacity: .9; }
    }

    /* =========================
       ナビゲーション
    ========================== */

    .nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 22px;
      padding-top: 12px;
      border-top: 1px dashed rgba(36,26,18,.4);
    }

    .nav-btn {
      padding: 8px 2px;
      background: none;
      border: 0;
      color: var(--ink);
      font-weight: 800;
      letter-spacing: .08em;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: rgba(36,26,18,.35);
      text-underline-offset: 5px;
    }

    .nav-btn:hover { color: var(--red); text-decoration-color: var(--red); }

    .nav-btn:disabled {
      opacity: .35;
      cursor: default;
      color: var(--ink);
      text-decoration-color: rgba(36,26,18,.35);
    }

    .nav-btn:focus-visible {
      outline: 2px solid var(--pen);
      outline-offset: 2px;
    }

    /* =========================
       夜明け（完了画面）
    ========================== */

    .clear {
      display: none;
      padding: 38px 22px 26px;
      text-align: center;
    }

    .sun-wrap {
      width: 150px;
      height: 74px;
      margin: 0 auto 8px;
      overflow: hidden;
      border-bottom: 3px solid var(--ink);
    }

    .sun {
      width: 104px;
      height: 104px;
      margin: 0 auto;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #f3c47a, #c9563a);
      animation: rise 2.4s ease-out both;
    }

    @keyframes rise {
      from { transform: translateY(84px); }
      to   { transform: translateY(24px); }
    }

    .clear h2 {
      margin: 12px 0 4px;
      font-size: 1.5rem;
      letter-spacing: .2em;
      text-indent: .2em;
    }

    .seal {
      display: inline-block;
      margin: 10px 0 14px;
      padding: 8px 18px;
      border: 3px double var(--red);
      color: var(--red);
      font-weight: 800;
      letter-spacing: .12em;
      transform: rotate(-2deg);
    }

    .score-text {
      margin: 0 0 18px;
      color: var(--ink-soft);
      line-height: 2;
    }

    .btn-review {
      display: block;
      width: 100%;
      margin: 0 0 14px;
      padding: 13px;
      background: var(--red);
      color: var(--paper-hi);
      border: 3px solid var(--red);
      border-radius: 3px;
      font-weight: 800;
      letter-spacing: .14em;
      cursor: pointer;
    }

    .btn-review:hover { background: var(--red-hi); border-color: var(--red-hi); }

    .btn-review:focus-visible {
      outline: 3px solid var(--pen);
      outline-offset: 3px;
    }

    /* =========================
       データ読み込み
    ========================== */

    details.loader {
      margin-top: 22px;
      padding: 12px 16px;
      background: rgba(4,9,8,.78);
      border: 1px solid rgba(223,234,223,.2);
      border-radius: 3px;
      color: #cfe0d3;
    }

    details.loader summary {
      cursor: pointer;
      font-size: .82rem;
      letter-spacing: .06em;
    }

    details.loader textarea {
      width: 100%;
      height: 120px;
      margin-top: 12px;
      padding: 10px;
      background: var(--paper-hi);
      color: var(--ink);
      border: 1px solid var(--paper-lo);
      border-radius: 2px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: .78rem;
      resize: vertical;
    }

    .btn-load {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      background: transparent;
      color: #cfe0d3;
      border: 2px solid #cfe0d3;
      border-radius: 3px;
      font-weight: 700;
      letter-spacing: .1em;
      cursor: pointer;
    }

    .btn-load:hover { background: #cfe0d3; color: #07110e; }

    /* =========================
       スマホ
    ========================== */

    @media (max-width: 600px) {
      .split { grid-template-columns: 1fr; }
      .side.credit { border-left: 0; border-top: 2px solid var(--red); }
    }

    @media (max-width: 520px) {
      body { padding: 36px 10px 28px; }
      .sign { padding: 14px; }
      .sign h1 { font-size: 1.3rem; }
      .sign-sub { font-size: .7rem; }
      .ledger { padding: 28px 16px 20px 22px; }
      .story { font-size: .98rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    .reset-area {
  display: flex;
  gap: 10px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed rgba(223,234,223,.25);
}

.btn-reset {
  flex: 1;
  padding: 10px;
  background: transparent;
  color: #cfe0d3;
  border: 2px solid rgba(207,224,211,.5);
  border-radius: 3px;
  font-weight: 700;
  letter-spacing: .06em;
  cursor: pointer;
}

.btn-reset:hover { background: rgba(207,224,211,.15); }

.btn-reset.danger { color: #e59a9a; border-color: #b02a2a; }
.btn-reset.danger:hover { background: #b02a2a; color: #fff; }

    
  </style>
</head>

<body>

  <svg id="scene" class="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMin slice" aria-hidden="true"></svg>
  <div class="mist m1"></div>
  <div class="mist m2"></div>
  <div id="blackout" aria-hidden="true"></div>

  <div class="page">

    <!-- 看板 -->
    <header class="sign">
      <div>
        <h1>13日の金曜日</h1>
        <p class="sign-sub">湖畔キャンプ場・夜明けまでの帳簿</p>
      </div>
      <span class="tag" id="status-tag">夜番中</span>
    </header>

    <!-- 夜の進み -->
    <div class="dawn">
      <div class="dawn-info">
        <span>夜の進み</span>
        <span id="progress-text">0%</span>
      </div>
      <div class="dawn-track">
        <div class="dawn-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- 問題 -->
    <main id="quiz-area" class="ledger">
      <span class="tape"></span>

      <p class="q-label" id="q-number">夜の記録 01 / 10</p>

      <p class="story" id="story-display">読み込み中…</p>

      <div class="note">
        メモ：（　）の中の科目を使って、借方と貸方を書こう。仮面の影が近づく前に、帳簿を合わせるんだ。
      </div>

      <div class="split">
        <section class="side debit" aria-labelledby="debit-title">
          <h2 class="side-title" id="debit-title">借方</h2>
          <div id="debit-rows"></div>
          <button type="button" class="btn-add" onclick="addRow('debit')">＋ 行を追加</button>
        </section>

        <section class="side credit" aria-labelledby="credit-title">
          <h2 class="side-title" id="credit-title">貸方</h2>
          <div id="credit-rows"></div>
          <button type="button" class="btn-add" onclick="addRow('credit')">＋ 行を追加</button>
        </section>
      </div>

      <button type="button" class="btn-stamp" id="submit-btn" onclick="checkAnswer()">記帳する</button>

      <div id="result-display" class="result" role="status" aria-live="polite"></div>

      <div class="nav">
        <button type="button" class="nav-btn" id="prev-btn" onclick="prevQuestion()">前の記録</button>
        <button type="button" class="nav-btn" id="next-btn" onclick="nextQuestion()">次の記録</button>
      </div>
    </main>

    <!-- 完了画面 -->
    <section id="clear-area" class="ledger clear">
      <span class="tape"></span>

      <div class="sun-wrap"><div class="sun"></div></div>

      <h2>夜が明けた</h2>

      <div id="complete-badge-area"></div>

      <p class="score-text" id="score-text"></p>

      <div id="review-btn-area"></div>

      <button type="button" class="btn-stamp" onclick="startFreshQuiz()">もう一度、夜を越える</button>
    </section>

    <!-- JSON読み込み -->
    <details class="loader">
      <summary>新しい「夜の記録」データを読み込む</summary>
      <textarea id="json-input" placeholder="JSONを貼り付けてください" aria-label="問題データのJSON"></textarea>
      <button type="button" class="btn-load" onclick="loadCustomData()">問題データを読み込む</button>
    <div class="reset-area">
  <button type="button" class="btn-reset" onclick="resetProgress()">進捗をリセット</button>
  <button type="button" class="btn-reset danger" onclick="resetAll()">すべて初期化</button>
</div>

    </details>

  </div>

<script>

/* =========================================================
   13日の金曜日 / 湖畔キャンプ場の帳簿
   問題データ（時系列: 17:00 → 夜明け前）
========================================================= */

const defaultData = [
  {
    "story": "【17:00】13日の金曜日の夕方。長いあいだ閉ざされていた湖畔のキャンプ場「クリスタルレイク」を、今夜だけ特別に再開することになった。オーナーのエマが、開業資金として現金300,000円を元入れした。「あの噂なんて、ただの作り話よ」と彼女は笑った。（現金）（資本金）",

/* =========================================================
   状態・保存
========================================================= */

const KEY = {
  data:      "crystal_lake_boki_data",
  idx:       "crystal_lake_current_idx",
  correct:   "crystal_lake_correct_cnt",
  wrong:     "crystal_lake_wrong_list",
  review:    "crystal_lake_is_review",
  reviewSet: "crystal_lake_review_set",
  answered:  "crystal_lake_answered"
};

const store = {
  get(k)    { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できない環境では何もしない */ } },
  remove(k) { try { localStorage.removeItem(k); } catch (e) { /* 同上 */ } }
};

function readJSON(k, fallback) {
  const raw = store.get(k);
  if (raw === null) return fallback;
  try { return JSON.parse(raw); } catch (e) { return fallback; }
}

let baseQuestions = [];
let currentQuestions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongList = [];
let answeredSet = new Set();
let isReviewMode = false;

function isValidData(data) {
  return Array.isArray(data) && data.length > 0 &&
    data.every(q => q && typeof q.story === "string" && q.debit && q.credit);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function persistState() {
  store.set(KEY.idx, String(currentIndex));
  store.set(KEY.correct, String(correctCount));
  store.set(KEY.wrong, JSON.stringify(wrongList));
  store.set(KEY.review, String(isReviewMode));
  store.set(KEY.answered, JSON.stringify([...answeredSet]));
}

function clearSavedProgress() {
  [KEY.idx, KEY.correct, KEY.wrong, KEY.review, KEY.reviewSet, KEY.answered]
    .forEach(k => store.remove(k));
}


/* =========================================================
   背景（夜の湖畔）
========================================================= */

function buildScene() {
  const svg = document.getElementById("scene");
  if (!svg) return;

  let seed = 13;
  const rnd = () => {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  };

  const pine = (x, base, h, w) => {
    const p = (dx, dy) => `${(x + dx).toFixed(1)},${(base - dy).toFixed(1)}`;
    return `M${p(0, h)} L${p(w * .30, h * .64)} L${p(w * .15, h * .64)} ` +
           `L${p(w * .48, h * .34)} L${p(w * .26, h * .34)} L${p(w * .62, 0)} ` +
           `L${p(-w * .62, 0)} L${p(-w * .26, h * .34)} L${p(-w * .48, h * .34)} ` +
           `L${p(-w * .15, h * .64)} L${p(-w * .30, h * .64)}Z `;
  };

  let back = "";
  for (let x = -40; x < 1260; x += 10 + rnd() * 20) {
    const h = 80 + rnd() * 110;
    back += pine(x, 560, h, h * .4);
  }

  let front = "";
  for (let x = -60; x < 230; x += 28 + rnd() * 30) {
    const h = 230 + rnd() * 150;
    front += pine(x, 820, h, h * .36);
  }
  for (let x = 1130; x < 1280; x += 28 + rnd() * 30) {
    const h = 230 + rnd() * 150;
    front += pine(x, 820, h, h * .36);
  }

  let stars = "";
  for (let i = 0; i < 46; i++) {
    const cx = rnd() * 1200;
    const cy = rnd() * 420;
    const r  = 0.6 + rnd() * 1.2;
    const o  = 0.35 + rnd() * 0.55;
    stars += `<circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${r.toFixed(1)}" fill="#fff" opacity="${o.toFixed(2)}"/>`;
  }

  let glint = "";
  for (let i = 0; i < 9; i++) {
    glint += `<ellipse cx="1010" cy="${585 + i * 24}" rx="${62 - i * 5}" ry="2.6" fill="#dfeadf" opacity="${(0.42 - i * 0.035).toFixed(2)}"/>`;
  }

  svg.innerHTML = `
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#030605"/>
        <stop offset=".55" stop-color="#0a1613"/>
        <stop offset="1" stop-color="#173029"/>
      </linearGradient>
      <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1d3b35"/>
        <stop offset="1" stop-color="#07110e"/>
      </linearGradient>
      <radialGradient id="moonGlow">
        <stop offset="0" stop-color="#cfe3da" stop-opacity=".34"/>
        <stop offset="1" stop-color="#cfe3da" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="moonBody" cx=".38" cy=".34">
        <stop offset="0" stop-color="#f6faf2"/>
        <stop offset=".7" stop-color="#cbdacd"/>
        <stop offset="1" stop-color="#a5bab0"/>
      </radialGradient>
      <clipPath id="lakeClip"><rect x="0" y="560" width="1200" height="240"/></clipPath>
    </defs>
    <rect width="1200" height="800" fill="url(#sky)"/>
    ${stars}
    <circle cx="1010" cy="125" r="180" fill="url(#moonGlow)"/>
    <circle cx="1010" cy="125" r="44" fill="url(#moonBody)"/>
    <path d="${back}" fill="#0d1d19"/>
    <rect y="560" width="1200" height="240" fill="url(#lake)"/>
    <g clip-path="url(#lakeClip)" opacity=".3">
      <path d="${back}" fill="#0d1d19" transform="translate(0 1120) scale(1 -1)"/>
    </g>
    <g class="glint">${glint}</g>
    <path d="${front}" fill="#030605"/>
  `;
}

function flicker() {
  const el = document.getElementById("blackout");
  el.classList.remove("flicker");
  void el.offsetWidth;
  el.classList.add("flicker");
}


/* =========================================================
   初期化
========================================================= */

function init() {
  buildScene();

  const saved = readJSON(KEY.data, null);
  baseQuestions = isValidData(saved) ? saved : defaultData;

  isReviewMode = store.get(KEY.review) === "true";

  const savedWrong = readJSON(KEY.wrong, []);
  wrongList = Array.isArray(savedWrong) ? savedWrong : [];

  const savedAnswered = readJSON(KEY.answered, []);
  answeredSet = new Set(Array.isArray(savedAnswered) ? savedAnswered : []);

  if (isReviewMode) {
    const rs = readJSON(KEY.reviewSet, wrongList);
    currentQuestions = (Array.isArray(rs) && rs.length > 0) ? rs : [...wrongList];
    if (currentQuestions.length === 0) {
      isReviewMode = false;
      currentQuestions = [...baseQuestions];
    }
  } else {
    currentQuestions = [...baseQuestions];
  }

  correctCount = parseInt(store.get(KEY.correct), 10) || 0;
  currentIndex = parseInt(store.get(KEY.idx), 10) || 0;

  if (currentIndex >= currentQuestions.length) {
    showClearScreen();
  } else {
    document.getElementById("quiz-area").style.display = "block";
    document.getElementById("clear-area").style.display = "none";
    loadQuestion(Math.max(0, currentIndex));
  }
}


/* =========================================================
   入力行
========================================================= */

function createRow(side) {
  const label = side === "debit" ? "借方" : "貸方";

  const div = document.createElement("div");
  div.className = "entry-row";

  const acc = document.createElement("input");
  acc.type = "text";
  acc.placeholder = "科目";
  acc.lang = "ja";
  acc.autocomplete = "off";
  acc.setAttribute("aria-label", `${label}の勘定科目`);

  const amt = document.createElement("input");
  amt.type = "number";
  amt.placeholder = "金額";
  amt.inputMode = "numeric";
  amt.min = "0";
  amt.setAttribute("aria-label", `${label}の金額`);

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "btn-remove";
  btn.textContent = "✕";
  btn.setAttribute("aria-label", `${label}の行を削除`);
  btn.addEventListener("click", () => removeRow(btn));

  div.append(acc, amt, btn);
  return div;
}

function addRow(side) {
  document.getElementById(`${side}-rows`).appendChild(createRow(side));
}

function removeRow(btn) {
  const row = btn.closest(".entry-row");
  if (row.parentElement.children.length > 1) {
    row.remove();
  } else {
    alert("行は最低1つ必要です。");
  }
}


/* =========================================================
   問題表示
========================================================= */

function loadQuestion(index) {
  if (index < 0 || index >= currentQuestions.length) return;

  currentIndex = index;
  persistState();

  const statusTag = document.getElementById("status-tag");
  statusTag.textContent = isReviewMode ? "見直し中" : "夜番中";
  statusTag.className = isReviewMode ? "tag review" : "tag";

  const prefix = isReviewMode ? "見直し" : "夜の記録";
  document.getElementById("q-number").textContent =
    `${prefix} ${String(index + 1).padStart(2, "0")} / ${String(currentQuestions.length).padStart(2, "0")}`;

  document.getElementById("story-display").textContent = currentQuestions[index].story;

  document.getElementById("debit-rows").innerHTML = "";
  document.getElementById("credit-rows").innerHTML = "";
  addRow("debit");
  addRow("credit");

  const res = document.getElementById("result-display");
  res.style.display = "none";
  res.className = "result";
  res.innerHTML = "";

  document.getElementById("prev-btn").disabled = (currentIndex === 0);

  document.getElementById("next-btn").textContent =
    currentIndex === currentQuestions.length - 1 ? "夜明けを迎える" : "次の記録";

  updateProgress();
}


/* =========================================================
   入力の取得と判定
========================================================= */

function getEntries(side) {
  const rows = document.getElementById(`${side}-rows`).children;
  const entries = [];

  for (const row of rows) {
    const inputs = row.querySelectorAll("input");
    const account = inputs[0].value.trim();
    const amount = parseInt(inputs[1].value, 10);

    if (account && !isNaN(amount)) {
      entries.push({ account, amount });
    }
  }

  return entries;
}

function normalizeData(sideData) {
  if (!sideData) return [];
  return Array.isArray(sideData) ? sideData : [sideData];
}

const normAccount = s => String(s).replace(/[\s\u3000]/g, "");

function matchSide(user, correct) {
  if (user.length !== correct.length) return false;

  const sorter = (a, b) =>
    normAccount(a.account).localeCompare(normAccount(b.account)) || a.amount - b.amount;

  const sU = [...user].sort(sorter);
  const sC = [...correct].sort(sorter);

  return sU.every((v, i) =>
    normAccount(v.account) === normAccount(sC[i].account) &&
    Number(v.amount) === Number(sC[i].amount)
  );
}

function checkAnswer() {
  const q = currentQuestions[currentIndex];

  const userDebit  = getEntries("debit");
  const userCredit = getEntries("credit");
  const correctDebit  = normalizeData(q.debit);
  const correctCredit = normalizeData(q.credit);

  const isOk = matchSide(userDebit, correctDebit) && matchSide(userCredit, correctCredit);

  const res = document.getElementById("result-display");
  res.style.display = "block";

  if (isOk) {

    res.className = "result correct";
    res.innerHTML = `
      <span class="stamp" aria-hidden="true">合</span>
      <strong>帳簿が合った。</strong><br>
      朝まで、あと少し。
      <span class="label">この仕訳のわけ</span>
      ${esc(q.explanation)}
    `;

    if (!answeredSet.has(currentIndex)) {
      correctCount++;

      if (isReviewMode) {
        wrongList = wrongList.filter(item => item.story !== q.story);
      }

      answeredSet.add(currentIndex);
    }

  } else {

    const fmt = list => list
      .map(e => `${esc(e.account)} ${Number(e.amount).toLocaleString()}円`)
      .join("、");

    res.className = "result wrong";
    res.innerHTML = `
      <strong>数字が合わない……。</strong><br>
      ランタンの灯りが揺れた。もう一度、帳簿を見直そう。
      <span class="label">正しい仕訳</span>
      <div class="answer-line">借方：${fmt(correctDebit)}</div>
      <div class="answer-line">貸方：${fmt(correctCredit)}</div>
      <span class="label">この仕訳のわけ</span>
      ${esc(q.explanation)}
    `;

    flicker();

    if (!answeredSet.has(currentIndex)) {
      if (!wrongList.some(item => item.story === q.story)) {
        wrongList.push(q);
      }
      answeredSet.add(currentIndex);
    }
  }

  persistState();
  updateProgress();
}


/* =========================================================
   ナビゲーション・進み
========================================================= */

function prevQuestion() {
  if (currentIndex > 0) loadQuestion(currentIndex - 1);
}

function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) {
    loadQuestion(currentIndex + 1);
  } else {
    showClearScreen();
  }
}

function updateProgress() {
  if (currentQuestions.length === 0) return;

  const percent = Math.round((currentIndex / currentQuestions.length) * 100);
  document.getElementById("progress-fill").style.width = percent + "%";
  document.getElementById("progress-text").textContent = percent + "%";
}


/* =========================================================
   完了画面
========================================================= */

function showClearScreen() {
  document.getElementById("quiz-area").style.display = "none";
  document.getElementById("clear-area").style.display = "block";

  document.getElementById("progress-fill").style.width = "100%";
  document.getElementById("progress-text").textContent = "100%";

  const total = currentQuestions.length;
  const badgeArea = document.getElementById("complete-badge-area");
  const scoreText = document.getElementById("score-text");
  const reviewBtnArea = document.getElementById("review-btn-area");

  badgeArea.innerHTML = "";
  reviewBtnArea.innerHTML = "";

  if (wrongList.length === 0) {

    badgeArea.innerHTML = `<div class="seal">全員そろって朝を迎えた</div>`;

    scoreText.innerHTML = `
      <strong>${total}問中 ${correctCount}問 正解</strong><br>
      湖の霧が晴れ、帳簿は1円のズレもなく合いました。
    `;

  } else {

    scoreText.innerHTML = `
      <strong>${total}問中 ${correctCount}問 正解</strong><br>
      合わない数字が、まだ <strong>${wrongList.length}問</strong> 残っています。
    `;

    const revBtn = document.createElement("button");
    revBtn.type = "button";
    revBtn.className = "btn-review";
    revBtn.textContent = `見落とした記録を見直す（${wrongList.length}問）`;
    revBtn.onclick = startReviewMode;
    reviewBtnArea.appendChild(revBtn);
  }

  store.set(KEY.idx, String(currentQuestions.length));
  store.set(KEY.correct, String(correctCount));
}


/* =========================================================
   見直し・最初から
========================================================= */

function startReviewMode() {
  isReviewMode = true;
  currentQuestions = [...wrongList];
  currentIndex = 0;
  correctCount = 0;
  answeredSet.clear();

  store.set(KEY.reviewSet, JSON.stringify(currentQuestions));

  document.getElementById("quiz-area").style.display = "block";
  document.getElementById("clear-area").style.display = "none";

  loadQuestion(0);
}

function startFreshQuiz() {
  clearSavedProgress();

  isReviewMode = false;
  currentQuestions = [...baseQuestions];
  wrongList = [];
  currentIndex = 0;
  correctCount = 0;
  answeredSet.clear();

  document.getElementById("quiz-area").style.display = "block";
  document.getElementById("clear-area").style.display = "none";

  loadQuestion(0);
}


/* =========================================================
   JSONデータ読み込み
========================================================= */

function loadCustomData() {
  const input = document.getElementById("json-input").value;

  try {
    const data = JSON.parse(input);

    if (!isValidData(data)) throw new Error("invalid");

    baseQuestions = data;
    store.set(KEY.data, JSON.stringify(data));

    alert("新しい記録を読み込みました。");
    startFreshQuiz();

  } catch (e) {
    alert("JSONの形式が正しくありません。story・debit・credit を含む配列になっているか確認してください。");
  }
}

/* 進捗だけリセット（問題データはそのまま） */
function resetProgress() {
  if (!confirm("進捗と正解数をリセットして、最初から始めます。よろしいですか？")) return;
  startFreshQuiz();
}
