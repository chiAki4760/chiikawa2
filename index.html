<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英作文スピーキング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#141B34; --muted:#56607E; --line:#D3D9E6;
  --brand:#2447C7; --brand-ink:#FFFFFF; --rec:#D92D34;
  --ok:#137A4F; --ok-bg:#DAF2E6;
  --near:#855400; --near-bg:#FAEAC4;
  --bad:#B42323; --bad-bg:#FADCDC;
  --ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --en:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1322; --surface:#171E35; --ink:#E7EBF8; --muted:#9AA5C6; --line:#2B3556;
    --brand:#7C98FF; --brand-ink:#0E1322; --rec:#FF6B70;
    --ok:#5FD4A0; --ok-bg:#12352A; --near:#F2C25B; --near-bg:#3A2E12; --bad:#FF8C8C; --bad-bg:#3C1B1E;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#171E35; --ink:#E7EBF8; --muted:#9AA5C6; --line:#2B3556;
  --brand:#7C98FF; --brand-ink:#0E1322; --rec:#FF6B70;
  --ok:#5FD4A0; --ok-bg:#12352A; --near:#F2C25B; --near-bg:#3A2E12; --bad:#FF8C8C; --bad-bg:#3C1B1E;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ja);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:16px 16px 56px}
.top h1{font-size:1.15rem;font-weight:700;margin:4px 0 12px;letter-spacing:.02em}
.setrow{display:flex;gap:8px}
select{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.ghost{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.ghost:active{background:var(--bg)}
.primary{display:block;width:100%;padding:14px 18px;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:700}
.primary:active{opacity:.85}
.link{color:var(--muted);text-decoration:underline;padding:8px 4px}

.pills{display:flex;gap:8px;overflow-x:auto;padding:14px 4px 12px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;min-width:40px;height:40px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted)}
.pill.st-correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pill.st-close{background:var(--near-bg);border-color:var(--near);color:var(--near)}
.pill.st-wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.pill.st-skipped{border-style:dashed;color:var(--ink)}
.pill.cur{outline:3px solid var(--brand);outline-offset:2px}
.pill.result{border-radius:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px}
.orderrow{margin-top:8px}
.qhead{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.tag.set{border-color:var(--line);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qlabel{font-weight:700;color:var(--brand);font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--brand);color:var(--brand);border-radius:999px;padding:0 9px}
.qtext{font-size:1.35rem;font-weight:500;line-height:1.75;margin:10px 0 18px}

textarea{display:block;width:100%;min-height:88px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--en);font-size:1.15rem;line-height:1.6;resize:vertical}
textarea:focus{border-color:var(--brand)}
.note{min-height:1.5em;margin:8px 0 0;font-size:.88rem;color:var(--muted)}
.note.err{color:var(--bad)}
.ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:14px 0 6px}
.ctrl > :first-child{justify-self:start}
.ctrl > :last-child{justify-self:end}
.mic{position:relative;width:88px;height:88px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.mic.on{background:var(--rec);color:#fff}
.mic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--rec);animation:ring 1.2s ease-out infinite}
.mic[disabled]{opacity:.4;cursor:not-allowed}
@keyframes ring{from{transform:scale(.92);opacity:.9}to{transform:scale(1.28);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic.on::after{animation:none}}
.miclabel{text-align:center;font-size:.85rem;color:var(--muted);margin:0 0 14px}
.row2{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px}
.toggle{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);margin-top:8px}
.toggle input{width:18px;height:18px}

.badge{display:inline-block;padding:5px 14px;border-radius:999px;font-weight:700}
.b-correct{background:var(--ok-bg);color:var(--ok)}
.b-close{background:var(--near-bg);color:var(--near)}
.b-wrong{background:var(--bad-bg);color:var(--bad)}
.b-skipped{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.cmp{display:grid;gap:10px;margin:14px 0 8px}
.cmprow{background:var(--bg);border-radius:12px;padding:10px 12px}
.cl{display:block;font-size:.78rem;color:var(--muted);margin-bottom:2px}
.en{font-family:var(--en);font-size:1.15rem;line-height:1.75;margin:0}
.w-miss{background:var(--bad-bg);color:var(--bad);border-radius:4px;padding:0 3px;font-weight:600}
.w-extra{color:var(--bad);text-decoration:line-through}
.resbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 10px}

.card h2{font-size:1.1rem;margin:0 0 6px}
.score{font-size:2.4rem;font-weight:700;margin:0 0 4px;line-height:1.2}
.score small{font-size:1rem;font-weight:500;color:var(--muted);margin-left:6px}
.sumlist{list-style:none;margin:16px 0;padding:0;display:grid;gap:10px}
.sumlist li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 12px;border-radius:12px;background:var(--bg);border-left:5px solid var(--line)}
.sumlist li.st-correct{border-left-color:var(--ok)}
.sumlist li.st-close{border-left-color:var(--near)}
.sumlist li.st-wrong{border-left-color:var(--bad)}
.sumlist .sl{font-weight:700;font-size:.9rem}
.sumlist .sj{margin:0;font-size:.95rem}
.sumlist .se{grid-column:2;margin:0;font-family:var(--en)}
.sumlist .ss{grid-column:1;font-size:.8rem;color:var(--muted)}
.stack{display:grid;gap:10px}

.manage textarea.json{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;min-height:170px}
.manage p{margin:8px 0}
.manage pre{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.78rem;white-space:pre-wrap;word-break:break-all;margin:8px 0}
.customlist{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.customlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:12px}
.customlist span{min-width:0;overflow-wrap:anywhere}
.danger{color:var(--bad);border-color:var(--bad)}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>英作文スピーキング</h1>
    <div class="setrow">
      <select id="setSel" aria-label="問題セット"></select>
      <button id="manageBtn" class="ghost" type="button">問題追加</button>
    </div>
    <div class="setrow orderrow">
      <select id="orderSel" aria-label="出題順">
        <option value="normal">順番どおり</option>
        <option value="items">問題ごとにシャッフル</option>
        <option value="sets">セット単位でシャッフル</option>
      </select>
      <button id="reshuffleBtn" class="ghost" type="button">並べ替え</button>
    </div>
  </header>

  <nav id="pills" class="pills" aria-label="問題の一覧"></nav>

  <!-- クイズ画面 -->
  <section id="quizView">
    <article class="card">
      <div class="qhead">
        <span id="qLabel" class="qlabel"></span>
        <span id="qFull" class="tag" hidden>全文</span>
        <span id="qSet" class="tag set" hidden></span>
      </div>
      <p id="qText" class="qtext"></p>

      <div id="inputArea">
        <textarea id="ans" rows="3" placeholder="英語で入力、またはマイクで話す" enterkeyhint="done" autocapitalize="sentences" autocomplete="off" spellcheck="false" lang="en"></textarea>
        <p id="note" class="note" role="status"></p>
        <div class="ctrl">
          <button id="hintBtn" class="ghost" type="button">ヒント</button>
          <button id="micBtn" class="mic" type="button" aria-pressed="false" aria-label="音声入力">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg>
          </button>
          <button id="clearBtn" class="ghost" type="button">消す</button>
        </div>
        <p id="micLabel" class="miclabel">タップして英語で話す</p>
        <button id="judgeBtn" class="primary" type="button">判定する</button>
        <div class="row2">
          <label class="toggle"><input type="checkbox" id="autoJudge"> 話し終わったら自動で判定</label>
          <button id="skipBtn" class="link" type="button">答えを見る</button>
        </div>
      </div>

      <div id="resultArea" hidden>
        <span id="badge" class="badge"></span>
        <div class="cmp">
          <div class="cmprow" id="userRow"><span class="cl">あなたの答え</span><p id="userLine" class="en"></p></div>
          <div class="cmprow"><span class="cl">お手本</span><p id="modelLine" class="en"></p></div>
        </div>
        <p id="legend" class="note" hidden>お手本の色つきの語が抜けている・違う語、あなたの答えの取り消し線が余分な語です。</p>
        <div class="resbtns">
          <button id="speakBtn" class="ghost" type="button">お手本を聞く</button>
          <button id="retryBtn" class="ghost" type="button">もう一度答える</button>
        </div>
        <button id="nextBtn" class="primary" type="button">次の問題へ</button>
      </div>
    </article>
  </section>

  <!-- 結果画面 -->
  <section id="summaryView" hidden>
    <article class="card">
      <h2>結果</h2>
      <p class="score" id="score"></p>
      <ul id="sumList" class="sumlist"></ul>
      <div class="stack">
        <button id="retryWrongBtn" class="primary" type="button">できなかった問題だけやり直す</button>
        <button id="restartBtn" class="ghost" type="button">最初からやり直す</button>
      </div>
      <p id="sumNote" class="note"></p>
    </article>
  </section>

  <!-- 問題追加画面 -->
  <section id="manageView" class="manage" hidden>
    <article class="card">
      <h2>問題を追加する</h2>
      <p>Claude に「この文をJSON形式で問題にして」と頼み、出力されたJSONを下に貼り付けてください。</p>
      <textarea id="jsonIn" class="json" placeholder='{"title":"...","items":[{"q":"日本語","a":"English"}]}' spellcheck="false" autocapitalize="off"></textarea>
      <p id="manageMsg" class="note" role="status"></p>
      <div class="stack">
        <button id="importBtn" class="primary" type="button">追加する</button>
        <button id="exampleBtn" class="ghost" type="button">書き方の例を入力欄に入れる</button>
        <button id="closeBtn" class="ghost" type="button">閉じて練習にもどる</button>
      </div>
      <p style="margin-top:18px"><strong>JSONの形式</strong>（<code>full</code> は全文の問題につけます）</p>
      <pre id="formatPre"></pre>
      <p><strong>追加した問題セット</strong></p>
      <ul id="customList" class="customlist"></ul>
    </article>
  </section>
</main>

      {"q": "社会的弱者", "a": "socially handicapped people"},
      {"q": "その人は寄付していたようだ", "a": "The man seems to have been donating"},
      {"q": "稼ぎの殆どを匿名で寄付していた", "a": "donating most of what he earned anonymously"},
      {"q": "その人は稼ぎの殆どを匿名で寄付していたようだ", "a": "The man seems to have been donating most of what he earned anonymously"},
      {"q": "その人は稼ぎの殆どを匿名で社会的弱者に寄付していたようだ。", "a": "The man seems to have been donating most of what he earned anonymously to socially handicapped people.", "full": true}
    ]
  }
];
EXTRA_SETS.forEach(function(s, i){ s.id = 'built-' + i; });

var EXAMPLE = '{"title":"例文","items":[\n  {"q":"父は一生懸命働いた","a":"My father worked hard"},\n  {"q":"私が大学で勉強できるように","a":"so that I could study at college"},\n  {"q":"父は、私が大学で勉強できるよう一生懸命働いた","a":"My father worked hard so that I could study at college","full":true}\n]}';
$('formatPre').textContent = EXAMPLE;

/* ---------- 状態 ---------- */
var LS_KEY = 'eisaku-speaking-v1';
var custom = [], autoJudge = false, lastId = null;
var sets = [], srcId = 'all', orderMode = 'normal', list = [], qi = 0, res = [], hintN = 0, mode = 'quiz';

function loadStore(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    var s = JSON.parse(raw) || {};
    if(Array.isArray(s.custom)) custom = s.custom.filter(function(c){ return c && Array.isArray(c.items) && c.items.length; });
    autoJudge = !!s.autoJudge;
    lastId = s.lastId || null;
    if(s.order === 'items' || s.order === 'sets') orderMode = s.order;
  }catch(e){}
}
function saveStore(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({custom:custom, autoJudge:autoJudge, lastId:srcId, order:orderMode}));
  }catch(e){}
}
function rebuildSets(){ sets = [SAMPLE].concat(EXTRA_SETS, custom); }

/* ---------- ユーティリティ ---------- */
var KANJI = ['','一','二','三','四','五','六','七','八','九'];
function kanji(n){
  if(n < 10) return KANJI[n];
  if(n < 20) return '十' + KANJI[n-10];
  if(n < 100) return KANJI[Math.floor(n/10)] + '十' + KANJI[n%10];
  return String(n);
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
function cur(){ return list[qi]; }
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function normalizeSrc(){
  if(srcId !== 'all' && !sets.some(function(s){ return s.id === srcId; })) srcId = 'all';
  if(srcId === 'all' && sets.length < 2) srcId = sets[0].id;
}
function totalCount(){
  return sets.reduce(function(n, s){ return n + s.items.length; }, 0);
}
/* 選んだセットから出題リストを作る（すべて＝追加した順に連結） */
function buildList(){
  var chosen = srcId === 'all' ? sets : sets.filter(function(s){ return s.id === srcId; });
  var groups = chosen.map(function(s){
    return s.items.map(function(it){
      return {q:it.q, a:it.a, full:!!it.full, setTitle:s.title, setId:s.id};
    });
  });
  if(orderMode === 'sets') groups = shuffle(groups);
  var flat = [].concat.apply([], groups);
  if(orderMode === 'items') flat = shuffle(flat);
  return flat;
}
function setNote(msg, isErr){
  var n = $('note'); n.textContent = msg || ''; n.className = 'note' + (isErr ? ' err' : '');
}
var STATUS_TEXT = {correct:'正解', close:'おしい', wrong:'ちがう', skipped:'答えを見た', none:'未回答'};

/* ---------- 判定ロジック ---------- */
function tokens(s){
  return s.toLowerCase()
    .replace(/[\u2018\u2019\u02BC`\u00B4]/g, "'")
    .replace(/[^a-z0-9'\s]/g, ' ')
    .replace(/(^|\s)'+/g, ' ')
    .replace(/'+(?=\s|$)/g, ' ')
    .split(/\s+/).filter(Boolean);
}
function analyze(str){
  var words = [], toks = [];
  str.trim().split(/\s+/).filter(Boolean).forEach(function(w){
    var t = tokens(w);
    words.push({w:w, s:toks.length, e:toks.length + t.length});
    Array.prototype.push.apply(toks, t);
  });
  return {words:words, toks:toks};
}
function diffWords(u, a){
  var n = u.length, m = a.length, i, j;
  var dp = [];
  for(i = 0; i <= n; i++){ dp.push(new Array(m + 1).fill(0)); }
  for(i = n - 1; i >= 0; i--){
    for(j = m - 1; j >= 0; j--){
      dp[i][j] = (u[i] === a[j]) ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
    }
  }
  var uMark = [], aMark = [];
  i = 0; j = 0;
  while(i < n && j < m){
    if(u[i] === a[j]){ uMark.push('ok'); aMark.push('ok'); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]){ uMark.push('extra'); i++; }
    else { aMark.push('miss'); j++; }
  }
  while(i < n){ uMark.push('extra'); i++; }
  while(j < m){ aMark.push('miss'); j++; }
  return {uMark:uMark, aMark:aMark, lcs:dp[0][0]};
}
function evaluate(user, ans){
  var U = analyze(user), A = analyze(ans);
  var d = diffWords(U.toks, A.toks);
  var same = U.toks.length === A.toks.length && d.lcs === A.toks.length;
  var ratio = d.lcs / Math.max(U.toks.length, A.toks.length, 1);
  return {U:U, A:A, d:d, status: same ? 'correct' : (ratio >= 0.8 ? 'close' : 'wrong')};
}
function markedHTML(an, marks, badClass){
  return an.words.map(function(o){
    var bad = false, any = false;
    for(var k = o.s; k < o.e; k++){ any = true; if(marks[k] !== 'ok') bad = true; }
    return '<span class="' + (any && bad ? badClass : '') + '">' + esc(o.w) + '</span>';
  }).join(' ');
}

/* ---------- 画面切り替え ---------- */
function showOnly(name){
  $('quizView').hidden = name !== 'quiz';
  $('summaryView').hidden = name !== 'summary';
  $('manageView').hidden = name !== 'manage';
}
function renderSelect(){
  var sel = $('setSel'); sel.innerHTML = '';
  if(sets.length > 1){
    var all = document.createElement('option');
    all.value = 'all';
    all.textContent = 'すべて（' + sets.length + 'セット・' + totalCount() + '問）';
    sel.appendChild(all);
  }
  sets.forEach(function(s){
    var o = document.createElement('option');
    o.value = s.id;
    o.textContent = s.title + '（' + s.items.length + '問）';
    sel.appendChild(o);
  });
  sel.value = srcId;
  $('orderSel').value = orderMode;
}
function renderPills(){
  var box = $('pills'); box.innerHTML = '';
  var curBtn = null;
  list.forEach(function(it, i){
    var b = document.createElement('button');
    var st = res[i] ? res[i].status : 'none';
    var isCur = mode === 'quiz' && i === qi;
    b.type = 'button';
    b.className = 'pill st-' + st + (isCur ? ' cur' : '');
    b.textContent = kanji(i + 1);
    b.setAttribute('aria-label', '問' + kanji(i + 1) + (it.full ? '（全文）' : '') + '：' + STATUS_TEXT[st]);
    if(isCur){ b.setAttribute('aria-current', 'true'); curBtn = b; }
    b.addEventListener('click', function(){ goTo(i); });
    box.appendChild(b);
  });
  var r = document.createElement('button');
  r.type = 'button';
  r.className = 'pill result' + (mode === 'summary' ? ' cur' : '');
  r.textContent = '結果';
  r.addEventListener('click', showSummary);
  box.appendChild(r);
  if(curBtn && curBtn.scrollIntoView){
    try{ curBtn.scrollIntoView({inline:'center', block:'nearest'}); }catch(e){}
  }
}
function loadSource(id){
  stopListen();
  if(id) srcId = id;
  normalizeSrc();
  list = buildList();
  qi = 0; mode = 'quiz';
  res = new Array(list.length).fill(null);
  $('setSel').value = srcId;
  $('orderSel').value = orderMode;
  saveStore();
  renderQuiz();
}
function goTo(i){
  stopListen();
  mode = 'quiz'; qi = i;
  renderQuiz();
}
function renderQuiz(){
  showOnly('quiz');
  var it = cur();
  $('qLabel').textContent = '問' + kanji(qi + 1);
  $('qFull').hidden = !it.full;
  $('qSet').hidden = srcId !== 'all';
  $('qSet').textContent = it.setTitle;
  $('qText').textContent = it.q;
  hintN = 0;
  $('ans').value = '';
  setNote('');
  if(res[qi]){ showResult(); }
  else { $('inputArea').hidden = false; $('resultArea').hidden = true; }
  renderPills();
  window.scrollTo(0, 0);
}

/* ---------- 回答・結果 ---------- */
function judge(){
  if(res[qi]) return;
  var user = $('ans').value.trim();
  if(!user){ setNote('英語を入力するか、マイクで話してください。', true); return; }
  stopListen();
  var ev = evaluate(user, cur().a);
  res[qi] = {status: ev.status, user: user};
  showResult();
}
function showResult(){
  var it = cur(), r = res[qi];
  $('inputArea').hidden = true;
  $('resultArea').hidden = false;
  var labels = {correct:'正解！', close:'おしい！ あと少しです', wrong:'もう一歩です', skipped:'お手本'};
  $('badge').textContent = labels[r.status];
  $('badge').className = 'badge b-' + r.status;
  if(r.status === 'skipped'){
    $('userRow').hidden = true;
    $('legend').hidden = true;
    $('modelLine').textContent = it.a;
  }else{
    var ev = evaluate(r.user, it.a);
    $('userRow').hidden = false;
    $('userLine').innerHTML = markedHTML(ev.U, ev.d.uMark, 'w-extra');
    $('modelLine').innerHTML = markedHTML(ev.A, ev.d.aMark, 'w-miss');
    $('legend').hidden = r.status === 'correct';
  }
  $('nextBtn').textContent = nextIndex() >= 0 ? '次の問題へ' : '結果を見る';
  renderPills();
}
function skip(){
  if(res[qi]) return;
  stopListen();
  res[qi] = {status:'skipped', user:''};
  showResult();
}
function retry(){
  res[qi] = null;
  $('ans').value = '';
  setNote('');
  $('inputArea').hidden = false;
  $('resultArea').hidden = true;
  renderPills();
  $('ans').focus();
}
function nextIndex(){
  /* すでに正解した問題はとばして、次に解くべき問題を探す */
  for(var i = qi + 1; i < list.length; i++){
    if(!res[i] || res[i].status !== 'correct') return i;
  }
  return -1;
}
function next(){
  var n = nextIndex();
  if(n >= 0){ goTo(n); }
  else { showSummary(); }
}
function hint(){
  hintN++;
  var words = cur().a.split(/\s+/);
  var shown = Math.min(words.length, hintN * 2);
  setNote('ヒント：' + words.slice(0, shown).join(' ') + (shown < words.length ? ' …' : ''));
}
function speak(text){
  if(!('speechSynthesis' in window)){ return; }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 結果画面 ---------- */
function showSummary(){
  stopListen();
  mode = 'summary';
  showOnly('summary');
  var items = list;
  var c = {correct:0, close:0, wrong:0, skipped:0, none:0};
  var list = $('sumList'); list.innerHTML = '';
  items.forEach(function(it, i){
    var st = res[i] ? res[i].status : 'none';
    c[st]++;
    var li = document.createElement('li');
    li.className = 'st-' + st;
    li.innerHTML =
      '<span class="sl">問' + kanji(i + 1) + '</span><p class="sj">' + esc(it.q) + '</p>' +
      '<span class="ss">' + STATUS_TEXT[st] + '</span><p class="se">' + esc(it.a) + '</p>';
    list.appendChild(li);
  });
  $('score').innerHTML = c.correct + ' / ' + items.length + '<small>正解</small>';
  $('sumNote').textContent = '';
  $('retryWrongBtn').hidden = (c.correct === items.length);
  renderPills();
  window.scrollTo(0, 0);
}
function retryWrong(){
  var first = -1;
  res = res.map(function(r, i){
    if(r && r.status === 'correct') return r;
    if(first < 0) first = i;
    return null;
  });
  if(first < 0){ $('sumNote').textContent = 'すべて正解しています。'; return; }
  goTo(first);
}
function restart(){ loadSource(); }

/* ---------- 音声入力 ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, listening = false, recErr = false, base = '';
function updateMic(){
  var b = $('micBtn');
  b.classList.toggle('on', listening);
  b.setAttribute('aria-pressed', listening ? 'true' : 'false');
  $('micLabel').textContent = listening ? '聞いています… もう一度タップで止める' : (SR ? 'タップして英語で話す' : '');
}
function startListen(){
  if(!SR){
    setNote('この環境では音声入力が使えません。Chrome・Edge・Safari で開くか、キーボードで入力してください。', true);
    return;
  }
  try{
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    rec = new SR();
    rec.lang = 'en-US';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;
    base = $('ans').value.trim();
    base = base ? base + ' ' : '';
    recErr = false;
    rec.onstart = function(){ listening = true; updateMic(); setNote(''); };
    rec.onresult = function(e){
      var t = '';
      for(var i = 0; i < e.results.length; i++){ t += e.results[i][0].transcript; }
      $('ans').value = base + t.trim();
    };
    rec.onerror = function(e){
      recErr = true;
      var m = {
        'not-allowed':'マイクが使えませんでした。ブラウザのマイク許可を確認するか、このページをブラウザで直接開いてください。',
        'service-not-allowed':'マイクが使えませんでした。ブラウザのマイク許可を確認してください。',
        'no-speech':'音声が聞き取れませんでした。もう一度話してください。',
        'audio-capture':'マイクが見つかりません。',
        'network':'音声認識サービスに接続できません。通信状況を確認してください。'
      };
      setNote(m[e.error] || '音声入力でエラーが起きました（' + e.error + '）。', true);
    };
    rec.onend = function(){
      listening = false; updateMic();
      if(!recErr && autoJudge && $('ans').value.trim() && !res[qi]){ judge(); }
    };
    rec.start();
  }catch(err){
    listening = false; updateMic();
    setNote('音声入力を開始できませんでした。', true);
  }
}
function stopListen(){
  if(rec){
    rec.onresult = rec.onend = rec.onerror = rec.onstart = null;
    try{ rec.abort(); }catch(e){}
    rec = null;
  }
  listening = false; updateMic();
}
function toggleMic(){
  if(listening && rec){ try{ rec.stop(); }catch(e){} }
  else { startListen(); }
}

/* ---------- 問題追加 ---------- */
function parseImport(raw){
  var txt = raw.replace(/```(?:json)?/gi, '').trim();
  if(!txt) throw new Error('JSONを貼り付けてください。');
  var data;
  try{ data = JSON.parse(txt); }
  catch(e){ throw new Error('JSONとして読み取れませんでした。かっこや引用符が欠けていないか確認してください。'); }
  var list;
  if(Array.isArray(data)){ list = (data[0] && data[0].items) ? data : [{items:data}]; }
  else { list = [data]; }
  return list.map(function(s, i){
    if(!s || !Array.isArray(s.items) || !s.items.length) throw new Error('items（問題の配列）が見つかりません。');
    var items = s.items.map(function(it, k){
      if(!it || typeof it.q !== 'string' || typeof it.a !== 'string' || !it.q.trim() || !it.a.trim()){
        throw new Error((k + 1) + '番目の問題に q（日本語）と a（英語）が必要です。');
      }
      return {q:it.q.trim(), a:it.a.trim(), full:!!it.full};
    });
    return {
      id: 'c' + Date.now().toString(36) + i,
      title: (s.title && String(s.title).trim()) || ('追加した問題 ' + (custom.length + i + 1)),
      items: items
    };
  });
}
function renderCustomList(){
  var ul = $('customList'); ul.innerHTML = '';
  if(!custom.length){
    var li = document.createElement('li');
    li.innerHTML = '<span>まだありません</span>';
    ul.appendChild(li);
    return;
  }
  custom.forEach(function(c){
    var li = document.createElement('li');
    var sp = document.createElement('span');
    sp.textContent = c.title + '（' + c.items.length + '問）';
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'ghost'; b.textContent = '削除';
    var armed = false;
    b.addEventListener('click', function(){
      if(!armed){
        armed = true; b.textContent = 'もう一度タップで削除'; b.classList.add('danger');
        setTimeout(function(){ armed = false; b.textContent = '削除'; b.classList.remove('danger'); }, 3500);
        return;
      }
      custom = custom.filter(function(x){ return x.id !== c.id; });
      rebuildSets();
      if(srcId === c.id) srcId = 'all';
      normalizeSrc();
      saveStore(); renderSelect(); renderCustomList();
      $('manageMsg').textContent = '削除しました。'; $('manageMsg').className = 'note';
    });
    li.appendChild(sp); li.appendChild(b); ul.appendChild(li);
  });
}
function openManage(){
  stopListen();
  mode = 'manage';
  showOnly('manage');
  $('manageMsg').textContent = ''; $('manageMsg').className = 'note';
  renderCustomList();
  window.scrollTo(0, 0);
}
function closeManage(){ loadSource(); }
function doImport(){
  var msg = $('manageMsg');
  try{
    var added = parseImport($('jsonIn').value);
    custom = custom.concat(added);
    rebuildSets();
    srcId = 'all';
    saveStore(); renderSelect(); renderCustomList();
    $('jsonIn').value = '';
    msg.textContent = added.length + '件の問題セットを、これまでの問題のあとに追加しました。「すべて」を選ぶと、全部を通して練習できます。「閉じて練習にもどる」で始めましょう。';
    msg.className = 'note';
  }catch(e){
    msg.textContent = e.message; msg.className = 'note err';
  }
}

/* ---------- イベント ---------- */
$('setSel').addEventListener('change', function(e){ loadSource(e.target.value); });
$('orderSel').addEventListener('change', function(e){ orderMode = e.target.value; loadSource(); });
$('reshuffleBtn').addEventListener('click', function(){ loadSource(); });
$('manageBtn').addEventListener('click', function(){ if(mode === 'manage') closeManage(); else openManage(); });
$('judgeBtn').addEventListener('click', judge);
$('skipBtn').addEventListener('click', skip);
$('hintBtn').addEventListener('click', hint);
$('clearBtn').addEventListener('click', function(){ $('ans').value = ''; setNote(''); $('ans').focus(); });
$('micBtn').addEventListener('click', toggleMic);
$('speakBtn').addEventListener('click', function(){ speak(cur().a); });
$('retryBtn').addEventListener('click', retry);
$('nextBtn').addEventListener('click', next);
$('restartBtn').addEventListener('click', restart);
$('retryWrongBtn').addEventListener('click', retryWrong);
$('importBtn').addEventListener('click', doImport);
$('exampleBtn').addEventListener('click', function(){ $('jsonIn').value = EXAMPLE; });
$('closeBtn').addEventListener('click', closeManage);
$('autoJudge').addEventListener('change', function(e){ autoJudge = e.target.checked; saveStore(); });
$('ans').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); judge(); }
});

/* ---------- 起動 ---------- */
loadStore();
rebuildSets();
$('autoJudge').checked = autoJudge;
if(!SR){ $('micBtn').setAttribute('aria-disabled', 'true'); }
srcId = lastId || 'all';
normalizeSrc();
renderSelect();
updateMic();
loadSource();
})();
</script>
